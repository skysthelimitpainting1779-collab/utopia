name: Hosted MVP CI

on:
  push:
    branches:
      - feat/vercel-hosted-mvp
      - dev
  workflow_dispatch:

concurrency:
  group: hosted-mvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated control-plane output
        run: |
          tracked=$(git ls-files 'control-plane/.next/**' 'control-plane/.workflow-data/**' 'control-plane/node_modules/**')
          if [ -n "$tracked" ]; then
            echo "Generated control-plane output is tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Validate Vercel Services topology
        run: |
          python3 - <<'PY'
          import json

          with open("vercel.json", encoding="utf-8") as handle:
              cfg = json.load(handle)

          services = cfg.get("services")
          assert isinstance(services, dict), "vercel.json must define services"
          assert set(services) == {"utopia", "control"}, "unexpected Vercel service set"

          utopia = services["utopia"]
          control = services["control"]
          assert utopia.get("root") == "."
          assert utopia.get("entrypoint") == "Dockerfile.vercel"
          assert utopia.get("runtime") == "container"
          assert control.get("root") == "control-plane"
          assert control.get("framework") == "nextjs"

          def has_binding(caller, target, env):
              return any(
                  item.get("type") == "service"
                  and item.get("service") == target
                  and item.get("format") == "url"
                  and item.get("env") == env
                  for item in caller.get("bindings", [])
              )

          # Workflow -> Rust stays private. Rust -> control intentionally uses the
          # same-deployment VERCEL_URL fallback in AppState, because Vercel rejects
          # circular service binding graphs (utopia -> control -> utopia).
          assert has_binding(
              control, "utopia", "UTOPIA_INTERNAL_URL"
          ), "control -> utopia service binding is required"
          assert not has_binding(
              utopia, "control", "UTOPIA_CONTROL_PLANE_URL"
          ), "utopia -> control would create a circular Vercel service binding"

          rewrites = cfg.get("rewrites", [])
          assert rewrites == [
              {"source": "/control/(.*)", "destination": {"service": "control"}},
              {"source": "/(.*)", "destination": {"service": "utopia"}},
          ], "Vercel service rewrites must keep control first and catch-all last"

          crons = cfg.get("crons", [])
          assert {
              "path": "/control/jobs/tick",
              "schedule": "* * * * *",
          } in crons, "once-per-minute hosted drain cron is required"
          PY
          bash -n scripts/smoke-hosted.sh
          git diff --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U utopia -d utopia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UTOPIA_DATABASE_URL: postgres://utopia:utopia@localhost:5432/utopia
      UTOPIA_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Migrate twice
        run: |
          sqlx migrate run --database-url "$UTOPIA_DATABASE_URL"
          sqlx migrate run --database-url "$UTOPIA_DATABASE_URL"
      - name: Database-backed tests
        run: cargo test -p utopia-store

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: control-plane/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control-plane/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vercel container image
        run: docker build --file Dockerfile.vercel --tag utopia-vercel:test .
