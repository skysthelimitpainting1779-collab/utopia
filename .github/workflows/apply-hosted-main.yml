name: Apply hosted main patch

on:
  push:
    branches: [feat/vercel-hosted-mvp]
    paths:
      - scripts/apply_hosted_main.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-hosted-mvp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply idempotent patch
        run: python3 scripts/apply_hosted_main.py
      - name: Format
        run: cargo fmt --all
      - name: Compile affected crates
        run: cargo check -p utopia-store -p utopia-server --all-targets
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire hosted runtime into server [generated]"
          git push origin HEAD:feat/vercel-hosted-mvp
