name: Hosted MVP CI

on:
  push:
    branches:
      - feat/vercel-hosted-mvp
      - dev
  workflow_dispatch:

concurrency:
  group: hosted-mvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated control-plane output
        run: |
          tracked=$(git ls-files 'control-plane/.next/**' 'control-plane/.workflow-data/**' 'control-plane/node_modules/**')
          if [ -n "$tracked" ]; then
            echo "Generated control-plane output is tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Validate deployment files
        run: |
          python3 -m json.tool vercel.json >/dev/null
          bash -n scripts/smoke-hosted.sh
          git diff --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U utopia -d utopia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UTOPIA_DATABASE_URL: postgres://utopia:utopia@localhost:5432/utopia
      UTOPIA_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Migrate twice
        run: |
          sqlx migrate run --database-url "$UTOPIA_DATABASE_URL"
          sqlx migrate run --database-url "$UTOPIA_DATABASE_URL"
      - name: Database-backed tests
        run: cargo test -p utopia-store

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: control-plane/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control-plane/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Vercel container image
        run: docker build --file Dockerfile.vercel --tag utopia-vercel:test .
