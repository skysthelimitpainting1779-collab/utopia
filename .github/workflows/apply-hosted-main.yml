name: Finalize hosted source

on:
  push:
    branches: [feat/vercel-hosted-mvp]
    paths:
      - .github/workflows/apply-hosted-main.yml
      - scripts/apply_hosted_main.py
      - control-plane/package.json
      - .gitignore

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-hosted-mvp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: control-plane/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove accidentally tracked generated output
        run: |
          git rm -r --cached --ignore-unmatch control-plane/.next control-plane/.workflow-data
      - name: Apply idempotent Rust entrypoint patch
        run: python3 scripts/apply_hosted_main.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile affected Rust crates
        run: cargo check -p utopia-store -p utopia-server --all-targets
      - name: Lock and verify control-plane dependencies
        working-directory: control-plane
        run: |
          pnpm install --no-frozen-lockfile
          pnpm check
      - name: Commit deterministic generated changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize hosted runtime sources"
          git push origin HEAD:feat/vercel-hosted-mvp
